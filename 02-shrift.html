<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Денис Ковалёв, крупно</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Шрифт как окно: огромные названия проектов залиты скриншотами сайтов, сайт виден сквозь буквы */
  :root {
    --bg: #ecebf1;
    --ink: #17141f;
    --soft: #5f5a6e;
    --line: #cfccd9;
    --tint: #ecebf1;
    --disp: "Unbounded", "Arial Black", sans-serif;
    --text: "Golos Text", "Segoe UI", sans-serif;
    --side: max(16px, 3vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--tint); color: var(--ink); font: 400 18px/1.55 var(--text); transition: background-color .6s; overflow-x: hidden; }
  img { display: block; max-width: 100%; }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .wrap { padding-inline: var(--side); }

  .top { display: flex; align-items: center; gap: 30px; padding-block: 22px; font-weight: 500; }
  .top nav { display: flex; gap: 26px; margin-left: auto; }
  .top nav a { text-decoration: none; }
  .top nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .badge { border: 1.5px solid var(--ink); border-radius: 40px; padding: 6px 14px; font-size: 15px; }

  .hero { padding-block: 9vh 12vh; }
  .hero h1 { font: 900 clamp(46px, 9.2vw, 168px)/.92 var(--disp); letter-spacing: -.045em; }
  .hero h1 .slot { display: block; position: relative; height: 1em; overflow: hidden; }
  .hero h1 .slot span { display: block; transition: transform .7s cubic-bezier(.7,0,.2,1), opacity .7s; }
  .hero h1 .slot span.out { transform: translateY(-105%); opacity: 0; }
  .hero h1 .slot span.in { transform: translateY(105%); opacity: 0; }
  .hero .sub { display: flex; justify-content: space-between; gap: 40px; margin-top: 7vh; align-items: end; flex-wrap: wrap; }
  .hero .sub p { max-width: 40ch; font-size: 20px; }
  .who { display: flex; gap: 8px; flex-wrap: wrap; }
  .who button { border: 1.5px solid var(--ink); border-radius: 40px; padding: 6px 14px; font-size: 15px; }
  .who button[aria-pressed="true"] { background: var(--ink); color: var(--tint); }

  /* проекты */
  .proj { border-top: 2px solid var(--ink); padding-block: 26px 70px; }
  .proj .row { display: flex; justify-content: space-between; gap: 30px; align-items: baseline; flex-wrap: wrap; }
  .proj .row p { color: var(--soft); max-width: 48ch; }
  .proj .row .yr { font: 700 18px var(--disp); }
  .word {
    display: inline-block; font: 900 clamp(64px, 17.5vw, 330px)/.84 var(--disp); letter-spacing: -.06em;
    margin: 18px 0 26px; white-space: nowrap;
    background-size: cover; background-position: center top;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transition: background-position 3s ease;
  }
  .proj:hover .word { background-position: center 40%; }
  .proj .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .pill { border: 1.5px solid var(--ink); border-radius: 40px; padding: 10px 20px; font-weight: 500; }
  .pill.solid { background: var(--ink); color: var(--bg); }
  .proj .tags { color: var(--soft); font-size: 15px; margin-left: auto; }

  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s cubic-bezier(.7,0,.2,1); }
  .detail > div { overflow: hidden; }
  .proj.open .detail { grid-template-rows: 1fr; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 60px; padding-top: 50px; }
  .dgrid h3 { font: 700 15px var(--disp); margin-bottom: 10px; }
  .dgrid .problem { font: 400 clamp(22px, 2.2vw, 34px)/1.3 var(--text); grid-column: 1 / 3; max-width: 34ch; letter-spacing: -.01em; }
  .dgrid ol { list-style: none; counter-reset: d; }
  .dgrid ol li { counter-increment: d; padding: 14px 0 14px 44px; border-top: 1px solid var(--line); position: relative; }
  .dgrid ol li::before { content: counter(d); position: absolute; left: 0; top: 12px; font: 900 22px var(--disp); }
  .res { display: grid; gap: 18px; }
  .res div { border-top: 1px solid var(--line); padding-top: 10px; }
  .res b { display: block; font: 900 clamp(40px, 5vw, 84px)/1 var(--disp); letter-spacing: -.05em; }
  .shots { grid-column: 1 / 3; display: grid; grid-template-columns: 3fr 1fr; gap: 24px; align-items: start; }
  .frame { height: 70vh; overflow-y: auto; border-radius: 14px; background: #fff; box-shadow: 0 0 0 1.5px var(--ink); }
  .frame.ph { border-radius: 30px; box-shadow: 0 0 0 8px var(--ink); scrollbar-width: none; max-height: 640px; }
  .quote { grid-column: 1 / 3; font: 700 clamp(26px, 3.4vw, 54px)/1.1 var(--disp); letter-spacing: -.035em; max-width: 24ch; }
  .quote small { display: block; font: 400 17px var(--text); letter-spacing: 0; color: var(--soft); margin-top: 14px; }

  section.s { border-top: 2px solid var(--ink); padding-block: 26px 110px; }
  section.s > h2 { font: 700 15px var(--disp); margin-bottom: 40px; }
  .manifest { font: 900 clamp(42px, 7.4vw, 136px)/.92 var(--disp); letter-spacing: -.05em; }
  .about-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 60px; }
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 20px; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; }
  .steps li::before { content: counter(s); display: block; font: 900 clamp(60px, 7vw, 120px)/1 var(--disp); letter-spacing: -.06em; margin-bottom: 14px; }
  .steps b { display: block; font-weight: 500; }
  .steps p { color: var(--soft); font-size: 15px; }
  .prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .prices div { border-top: 1px solid var(--ink); padding-top: 14px; }
  .prices b { display: block; font: 700 clamp(24px, 2.4vw, 38px)/1.05 var(--disp); letter-spacing: -.03em; margin: 8px 0 12px; }
  .prices span { font-weight: 500; }
  .prices p { color: var(--soft); font-size: 15px; margin-top: 6px; }
  .fit { display: block; font: 900 10vw/.9 var(--disp); letter-spacing: -.05em; white-space: nowrap; text-decoration: none; }
  .fit:hover { -webkit-text-stroke: 2px var(--ink); color: transparent; }
  .contact-row { display: flex; justify-content: space-between; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
  .contact-row button { text-decoration: underline; text-underline-offset: 4px; }
  footer { padding-block: 20px; color: var(--soft); font-size: 14px; border-top: 1px solid var(--line); }

  @media (max-width: 820px) {
    .top nav { display: none; }
    .top { justify-content: space-between; }
    .hero { padding-block: 6vh 8vh; }
    .hero .sub p { font-size: 17px; }

    .proj .tags { margin-left: 0; width: 100%; }
    .dgrid { grid-template-columns: 1fr; gap: 30px; padding-top: 30px; }
    .dgrid .problem, .shots, .quote { grid-column: 1; }
    .shots { grid-template-columns: 1fr; }
    .shots .frame:not(.ph) { display: none; }
    .frame.ph { width: min(300px, 100%); margin: 0 auto; height: 70vh; }
    .about-cols, .prices { grid-template-columns: 1fr; }
    .steps { grid-template-columns: 1fr 1fr; }
    body { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body, .hero h1 .slot span, .detail, .word { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span id="dname"></span><nav><a href="#work">Работы</a><a href="#about">Обо мне</a><a href="#price">Цены</a><a href="#contact">Почта</a></nav><a class="badge" id="badge" target="_blank" rel="noopener"></a></header>

  <section class="hero" aria-label="Кто я">
    <h1>Делаю сайты для<span class="slot" id="slot" aria-live="polite"><span>пекарен</span></span></h1>
    <div class="sub">
      <p id="lead"></p>
      <div class="who" id="who" aria-label="Выбрать тип клиента"></div>
    </div>
  </section>

  <main id="work"></main>

  <section class="s" id="about">
    <h2>Обо мне</h2>
    <p class="manifest">Сначала разговор. Потом Figma.</p>
    <div class="about-cols" id="about-cols"></div>
  </section>

  <section class="s">
    <h2>Шесть шагов</h2>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="s" id="price">
    <h2>Цены</h2>
    <div class="prices" id="prices"></div>
  </section>

  <section class="s" id="contact">
    <h2>Почта</h2>
    <a class="fit" id="mail" href="#"></a>
    <div class="contact-row"><span id="tg"></span><button id="copy">Скопировать адрес</button></div>
  </section>
  <footer id="foot"></footer>
</div>

<script src="shared/projects.js?v=5"></script>
<script>
const D = window.DESIGNER, P = window.PROJECTS;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHOTO = { opara: 'opara-hero', zubr: 'zubr-doc1', tihiy: 'tihiy-2', plenka: 'plenka-hero', suharev: 'suharev-office', sherst: 'sherst-2' };
const WHO = { opara: 'пекарен', zubr: 'клиник', tihiy: 'прокатов', plenka: 'фестивалей', suharev: 'юристов', sherst: 'магазинов' };

$('#dname').textContent = D.name;
$("#badge").textContent = "Написать в телеграм"; $("#badge").href = "https://t.me/" + D.telegram.slice(1);
$('#lead').textContent = `${D.city}. Ниже шесть концептов, каждый можно раскрыть и прочитать целиком.`;
$('#foot').textContent = `${D.name}, ${new Date().getFullYear()}`;

/* слот в заголовке */
const slot = $('#slot');
let cur = 0, timer = null;
function setWho(i, user) {
  if (i === cur && slot.firstElementChild) return;
  const old = slot.firstElementChild;
  const neu = document.createElement('span');
  neu.textContent = WHO[P[i].id];
  if (!reduce && old) { neu.className = 'in'; slot.appendChild(neu); old.classList.add('out'); requestAnimationFrame(() => requestAnimationFrame(() => neu.className = '')); setTimeout(() => old.remove(), 700); neu.style.position = 'absolute'; neu.style.top = 0; setTimeout(() => neu.style.position = '', 700); }
  else { slot.innerHTML = ''; slot.appendChild(neu); }
  cur = i;
  document.body.style.setProperty('--tint', P[i].tint);
  document.querySelectorAll('#who button').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  if (user) { clearInterval(timer); timer = null; }
}
$('#who').innerHTML = P.map((p, i) => `<button aria-pressed="${i === 0}" data-i="${i}">${WHO[p.id]}</button>`).join('');
$('#who').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setWho(+b.dataset.i, true); });
document.body.style.setProperty('--tint', P[0].tint);
if (!reduce) timer = setInterval(() => setWho((cur + 1) % P.length), 2600);

/* проекты */
$('#work').innerHTML = P.map((p, i) => `
  <article class="proj" id="${p.id}">
    <div class="row"><p>${esc(p.client)}, ${esc(p.city)}. ${esc(p.short)}.</p><span class="yr">${p.year}</span></div>
    <span class="word" style="background-image:linear-gradient(rgba(20,16,40,.22),rgba(20,16,40,.22)),url('_клиенты/photos/${PHOTO[p.id]}.jpg')" role="img" aria-label="${esc(p.name)}">${esc(p.name)}</span>
    <div class="bar">
      <button class="pill solid" aria-expanded="false" aria-controls="d-${p.id}">Читать кейс</button>
      <span class="tags">${esc(p.kind)}. ${esc(p.tools)}</span>
    </div>
    <div class="detail" id="d-${p.id}"><div><div class="dgrid">
      <p class="problem">${esc(p.problem)}</p>
      <div><h3>Что сделали</h3><ol>${p.did.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
      <div class="res"><h3>В цифрах</h3>${p.result.map(([a, b]) => `<div><b>${esc(a)}</b>${esc(b)}</div>`).join('')}</div>
      <div class="shots">
        <div class="frame" tabindex="0" aria-label="Вся страница, прокручивается"><img data-src="${shot(p, 'full')}" alt="Сайт ${esc(p.name)} целиком"></div>
        <div class="frame ph" tabindex="0" aria-label="Мобильная версия, прокручивается"><img data-src="${shot(p, 'mobfull')}" alt="Мобильная версия"></div>
      </div>
      <p class="quote">«${esc(p.quote)}»<small>${esc(p.quoteBy)}</small></p>
    </div></div></div>
  </article>`).join('');

document.querySelectorAll('.proj .pill').forEach(btn => btn.addEventListener('click', () => {
  const proj = btn.closest('.proj');
  const open = proj.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
  btn.textContent = open ? 'Свернуть' : 'Читать кейс';
  proj.querySelectorAll('img[data-src]').forEach(im => { im.src = im.dataset.src; im.removeAttribute('data-src'); });
  if (!open) proj.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}));

/* при прокрутке фон берёт цвет проекта на экране */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) document.body.style.setProperty('--tint', P.find(p => p.id === e.target.id).tint);
}), { rootMargin: '-45% 0px -45% 0px' });
document.querySelectorAll('.proj').forEach(el => io.observe(el));
new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.body.style.setProperty('--tint', getComputedStyle(document.documentElement).getPropertyValue('--bg')); }), { rootMargin: '-45% 0px -45% 0px' }).observe($('#about'));

$('#about-cols').innerHTML = D.about.map(t => `<p>${esc(t)}</p>`).join('');
$('#steps').innerHTML = D.process.map(s => `<li><b>${esc(s.name)}</b><p>${esc(s.text)}</p></li>`).join('');
$('#prices').innerHTML = D.services.map(s => `<div><span>${esc(s.name)}</span><b>${esc(s.price)}</b>${esc(s.time)}<p>${esc(s.text)}</p></div>`).join('');

/* почта на всю ширину */
const mail = $('#mail');
mail.textContent = D.email; mail.href = 'mailto:' + D.email;
$('#tg').textContent = 'Телеграм ' + D.telegram + '. Отвечаю в течение дня.';
function fit() { mail.style.fontSize = '100px'; const w = mail.parentElement.clientWidth; mail.style.fontSize = Math.min(220, 100 * w / mail.scrollWidth * .98) + 'px'; }
function fitWords() { document.querySelectorAll('.word').forEach(w => { w.style.fontSize = '100px'; const max = Math.min(330, innerWidth * .2); w.style.fontSize = Math.min(max, 100 * w.parentElement.clientWidth / w.scrollWidth * .97) + 'px'; }); }
document.fonts.ready.then(() => { fit(); fitWords(); }); addEventListener('resize', () => { fit(); fitWords(); });
$('#copy').addEventListener('click', async e => {
  try { await navigator.clipboard.writeText(D.email); e.target.textContent = 'Скопировано'; }
  catch { getSelection().selectAllChildren(mail); e.target.textContent = 'Адрес выделен'; }
  setTimeout(() => e.target.textContent = 'Скопировать адрес', 2200);
});
</script>
</body>
</html>
